<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;700&amp;family=Noto+Sans+Thai:wght@400;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans Thai', 'SF Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="45" fill="white" font-size="24" font-weight="700">กระบวนการสร้างและความฉลาดของ AI (How LLMs Work)</text>
  <text x="30" y="75" fill="#94a3b8" font-size="14">จากแหล่งข้อมูลมหาศาล สู่การคำนวณที่ดูเหมือน "ความเข้าใจ"</text>

  <!-- Regions -->
  <rect x="20" y="110" width="225" height="480" rx="12" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="32" y="135" fill="#94a3b8" font-size="13" font-weight="600">INPUT: THE SEA OF DATA</text>

  <rect x="260" y="110" width="465" height="480" rx="12" fill="none" stroke="rgba(34,211,238,0.2)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="272" y="135" fill="#22d3ee" font-size="13" font-weight="600">PROCESS: TRAINING PIPELINE</text>

  <rect x="740" y="110" width="245" height="480" rx="12" fill="none" stroke="rgba(167,139,250,0.2)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="752" y="135" fill="#a78bfa" font-size="13" font-weight="600">USAGE: INFERENCE</text>

  <!-- Connections -->
  <path d="M 215,200 L 290,200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 215,330 L 290,330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 215,460 L 290,460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 455,330 L 530,330" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M 695,330 L 770,330" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-emerald)"/>

  <!-- Components: Step 1 Data Sources -->
  <g transform="translate(45, 170)">
    <rect width="170" height="60" rx="6" fill="#0f172a"/>
    <rect width="170" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="85" y="27" fill="white" font-size="14" font-weight="600" text-anchor="middle">Internet &amp; Books</text>
    <text x="85" y="47" fill="#94a3b8" font-size="12" text-anchor="middle">ข้อมูลดิบจากทั่วโลก</text>
  </g>

  <g transform="translate(45, 300)">
    <rect width="170" height="60" rx="6" fill="#0f172a"/>
    <rect width="170" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="85" y="27" fill="white" font-size="14" font-weight="600" text-anchor="middle">Academic Data</text>
    <text x="85" y="47" fill="#94a3b8" font-size="12" text-anchor="middle">วิจัย/เอกสารราชการ</text>
  </g>

  <g transform="translate(45, 430)">
    <rect width="170" height="60" rx="6" fill="#0f172a"/>
    <rect width="170" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="85" y="27" fill="white" font-size="14" font-weight="600" text-anchor="middle">Code &amp; Math</text>
    <text x="85" y="47" fill="#94a3b8" font-size="12" text-anchor="middle">ตรรกะและการเขียน</text>
  </g>

  <!-- Components: Step 2 Processing -->
  <g transform="translate(290, 270)">
    <rect width="165" height="130" rx="6" fill="#0f172a"/>
    <rect width="165" height="130" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="82.5" y="35" fill="white" font-size="14" font-weight="600" text-anchor="middle">Data Preparation</text>
    <text x="82.5" y="65" fill="#94a3b8" font-size="12" text-anchor="middle">Cleaning • Filtering</text>
    <text x="82.5" y="85" fill="#94a3b8" font-size="12" text-anchor="middle">Tokenization</text>
    <text x="82.5" y="110" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">"แปลงภาษาเป็นตัวเลข"</text>
  </g>

  <!-- Components: Step 3 Training -->
  <g transform="translate(530, 270)">
    <rect width="165" height="130" rx="6" fill="#0f172a"/>
    <rect width="165" height="130" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="82.5" y="35" fill="white" font-size="14" font-weight="600" text-anchor="middle">Transformer Brain</text>
    <text x="82.5" y="65" fill="#94a3b8" font-size="12" text-anchor="middle">Pre-training (GPUs)</text>
    <text x="82.5" y="85" fill="#94a3b8" font-size="12" text-anchor="middle">Learned Patterns</text>
    <text x="82.5" y="110" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">"จำรูปแบบความสัมพันธ์"</text>
  </g>

  <!-- Components: Step 4 Usage -->
  <g transform="translate(775, 290)">
    <rect width="190" height="90" rx="6" fill="#0f172a"/>
    <rect width="190" height="90" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="95" y="32" fill="white" font-size="14" font-weight="600" text-anchor="middle">Prediction Engine</text>
    <text x="95" y="55" fill="#94a3b8" font-size="12" text-anchor="middle">Inference / Reasoning</text>
    <text x="95" y="75" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">"ทายคำต่อไปที่น่าจะถูก"</text>
  </g>

  <!-- Prompt Box -->
  <rect x="775" y="190" width="190" height="50" rx="25" fill="white" stroke="#a78bfa" stroke-width="1"/>
  <text x="870" y="222" fill="#1e293b" font-size="13" font-weight="600" text-anchor="middle">"ช่วยสรุปรายงานให้หน่อย"</text>
  <path d="M 870,240 L 870,280" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="882" y="265" fill="#a78bfa" font-size="11">User Prompt</text>

  <!-- Legend -->
  <g transform="translate(300, 610)">
    <rect width="14" height="14" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="22" y="12" fill="#94a3b8" font-size="12">Data</text>
    <rect x="80" width="14" height="14" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="102" y="12" fill="#94a3b8" font-size="12">Processing</text>
    <rect x="200" width="14" height="14" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="222" y="12" fill="#94a3b8" font-size="12">Learning</text>
    <rect x="320" width="14" height="14" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="342" y="12" fill="#94a3b8" font-size="12">Inference</text>
  </g>
</svg>
